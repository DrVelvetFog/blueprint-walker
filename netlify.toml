# netlify.toml  — place at the repo root
[build]
  command = "npm run build"
  publish = "dist"            # Vite's output folder

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback: send any unknown path to index.html so deep links don't 404.
# Functions at /.netlify/functions/* are served natively by Netlify before this
# catch-all is applied, so the function path passes through untouched — no
# explicit redirect for it is needed (and one would be rejected as invalid).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
